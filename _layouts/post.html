---
layout: default
---

<div class="content w-full md:w-4/5 p-8 h-full overflow-scroll">
  <div class="max-w-3xl mx-auto mb-24">
    <h1 class="font-gelica text-primary text-4xl font-bold mb-6">{{ page.title }}</h1>
    <div class="text-lg leading-loose [&>*]:mb-6">
      {{ content }}
    </div>
    <p class="mt-8 p-4 bg-amber-100 rounded-lg text-amber-900">Posted by <a href="https://github.com/{{ page.author }}" class="underline decoration-primary">@{{ page.author }}</a> on {{ page.date | date: "%b %e, %Y"}}</p>
  </div>
</div>
