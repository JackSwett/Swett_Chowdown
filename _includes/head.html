<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">


  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl }}" />
  <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
  <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.4/hammer.min.js"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ site.baseurl }}/icons/favicon-512x512.png">
  <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
  <link rel="shortcut icon" href="{{ site.baseurl }}/icons/favicon.ico">
  <meta name="msapplication-TileColor" content="#047857">
  <meta name="msapplication-config" content="{{ site.baseurl }}/icons/browserconfig.xml">
  <meta name="theme-color" content="#047857">


  <!-- Facebook Meta Tags -->
  <meta property="og:url" content="{% if page.title %}{{ page.url | replace:'index.html','' | prepend: site.baseurl }}{% else %}{{ site.baseurl }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{% if page.title %}{{ site.baseurl }}/images/{{ page.image }}{% else %}/assets/social.png{% endif %}">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="recipes.swett.org">
  <meta property="twitter:url" content="{% if page.title %}{{ page.url | replace:'index.html','' | prepend: site.baseurl }}{% else %}{{ site.baseurl }}{% endif %}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{% if page.title %}{{ site.baseurl }}/images/{{ page.image }}{% else %}/assets/social.png{% endif %}">


  <style>
    @view-transition {
      navigation: auto;
    }
    .overflow-scroll::-webkit-scrollbar {
        display: none;
    }
    .overflow-scroll {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://use.typekit.net/htf0jhw.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#047857',
            sand: '#E0E3D0',
          },
          boxShadow: {
            '3xl': '0 0px 60px -15px rgba(0, 0, 0, 0.5)',
          },
          fontFamily: {
            gelica: ['gelica', 'sans-serif'],
            inter: ['inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    @media print {
      @page {
        margin: 0.75in;
      }
      /* Hide navigation, mobile header, back button, image credit */
      /* NOTE: Checkboxes are intentionally kept — useful for checking off steps on paper */
      /* NOTE: Nutrition info and servings/meta are intentionally kept in print */
      nav, header.md\:hidden, .back, .imagecredit, a[href*="imagecredit"],
      header:not(.recipe-header), .components, .tags {
        display: none !important;
      }
      /* Single-column layout for recipes */
      .grid.md\:grid-cols-2 {
        display: block !important;
      }
      /* Hide recipe image — background-image doesn't print */
      .image, .clearfix .image.ratio {
        display: none !important;
      }
      /* Full-width content, no scroll container */
      .post-content {
        overflow: visible !important;
        height: auto !important;
        padding: 0.5rem !important;
        margin-bottom: 0 !important;
        gap: 0.5rem !important;
        font-size: 12pt !important;
      }
      .post-content.mb-24 {
        margin-bottom: 0 !important;
      }
      /* Compact header spacing */
      .recipe-header {
        gap: 0.5rem !important;
        padding-top: 0 !important;
      }
      .recipe-header .recipe-title {
        font-size: 25pt !important;
        line-height: 1.3 !important;
        padding: 1.0rem 0 !important;
      }
      /* Hide description in header — it moves to print-description area */
      .recipe-header [itemprop="description"] {
        display: none !important;
      }
      /* Ingredients + description side by side, directions full-width below */
      .post-content > div:not(.nutrition):not(.components) {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 0 1.5rem !important;
        align-items: start !important;
      }
      /* Directions span full width */
      .post-content > div:not(.nutrition):not(.components) > .sm-col {
        grid-column: 1 / -1 !important;
      }
      /* Body text size — 12pt, 1.5 line spacing.
         Overrides Tailwind's text-lg and leading-loose on ingredient/direction items. */
      .post-content li {
        font-size: 12pt !important;
        line-height: 1.5 !important;
      }
      .post-content li.text-lg,
      .post-content li.leading-loose {
        font-size: 12pt !important;
        line-height: 1.5 !important;
      }
      /* Component ingredient links — plain text in print */
      .post-content li a[href^="#"] {
        text-decoration: none !important;
        color: inherit !important;
      }
      .post-content li a[href^="#"] svg {
        display: none !important;
      }
      /* Paragraph spacing between direction steps */
      .post-content ul[itemprop="recipeInstructions"] {
        gap: 0.75rem !important;
      }
      .post-content ul[itemprop="ingredients"] {
        gap: 0.2rem !important;
      }
      .post-content h2, .post-content h4:not(.font-gelica) {
        font-size: 12pt !important;
        margin-bottom: 0.25rem !important;
        border-bottom: 0.5pt solid #ccc !important;
        padding-bottom: 0.2rem !important;
      }
      /* Show print-only description beside ingredients */
      .print-description {
        display: block !important;
        font-size: 12pt !important;
        line-height: 1.5 !important;
      }
      .print-description * {
        font-size: 12pt !important;
        line-height: 1.5 !important;
      }
      .print-description h2 {
        color: #1a1a1a !important;
      }
      /* Nutrition info — styled for clean print output */
      .nutrition {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 1rem !important;
      }
      .nutrition h4 {
        font-size: 12pt !important;
        font-weight: bold !important;
        color: #1a1a1a !important;
        margin-bottom: 0.5rem !important;
        text-transform: uppercase !important;
      }
      .nutrition div[itemprop="nutrition"] {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 0.25rem !important;
      }
      .nutrition div[itemprop="nutrition"] > div {
        border: 1px solid #ccc !important;
        border-radius: 4px !important;
        text-align: center !important;
        min-width: 70px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .nutrition h5 {
        background: #e5e5e5 !important;
        color: #1a1a1a !important;
        margin: 0 !important;
        padding: 0.2rem 0.4rem !important;
        font-size: 8pt !important;
        text-transform: capitalize !important;
      }
      .nutrition p {
        font-size: 11pt !important;
        color: #1a1a1a !important;
        margin: 0 !important;
        padding: 0.3rem 0.4rem !important;
      }
      /* Remove top padding meant for mobile header */
      .pt-14 {
        padding-top: 0 !important;
      }
      /* White background for paper */
      body, .bg-sand {
        background: white !important;
      }
      /* Black text for readability */
      .text-primary, .recipe-title {
        color: #1a1a1a !important;
      }
      /* Tags */
      .tags {
        gap: 0.25rem !important;
      }
      .tag {
        background: #e5e5e5 !important;
        color: #333 !important;
        font-size: 12pt !important;
        padding: 0.15rem 0.5rem !important;
      }
      /* Recipe meta pills */
      .recipe-meta {
        gap: 0.5rem !important;
        font-size: 12pt !important;
        margin-bottom: 1rem !important;
      }
      .recipe-meta span {
        padding: 0 !important;
        background: none !important;
      }
      /* Each component recipe starts on a new page.
         The break is on the wrapper div, not the h4, to avoid blank pages
         caused by the h4's top margin pushing content past the break. */
      .clearfix .sm-col {
        page-break-before: always !important;
        break-before: page !important;
      }
      .post-content h4.font-gelica {
        font-family: gelica, sans-serif !important;
        font-weight: bold !important;
        font-size: 25pt !important;
        line-height: 1.3 !important;
        padding: 1.0rem 0 !important;
        margin-top: 0 !important;
      }
      /* QR code — top right corner */
      #recipe-qr {
        display: block !important;
        position: absolute !important;
        top: 0.5rem !important;
        right: 0.5rem !important;
        z-index: 100 !important;
      }
      #recipe-qr img {
        width: 80px !important;
        height: 80px !important;
      }
      #recipe-qr canvas {
        width: 80px !important;
        height: 80px !important;
      }
      /* Remove hover/transition effects */
      * {
        transition: none !important;
      }
      /* Avoid page breaks inside list items — never split a single instruction across pages */
      li {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      /* Site URL under QR code — just the domain, not the full URL.
         Most browsers already print the full URL in their header/footer. */
      .print-site-url {
        display: block !important;
        position: absolute !important;
        top: calc(0.5rem + 80px + 0.2rem) !important;
        right: 0.5rem !important;
        width: 80px !important;
        font-size: 7pt !important;
        color: #666 !important;
        text-align: center !important;
      }
      /* Hide print button */
      .print-btn {
        display: none !important;
      }
    }
  </style>

  <script>
    if ("serviceWorker" in navigator) {
    if (navigator.serviceWorker.controller) {
      console.log("An active service worker found, no need to register");
    } else {
      // Register the service worker
      navigator.serviceWorker
        .register("{{ site.baseurl }}/serviceworker.js", {
          scope: "./"
        })
        .then(function (reg) {
          console.log("Service worker has been registered for scope: " + reg.scope);
        });
    }
  }
  </script>

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  {% if page.title %}<meta name="twitter:title" content="{{ page.title }}">{% else %}<meta name="twitter:title" content="{{ site.title }}">{% endif %}
  {% if page.url %}<meta name="twitter:url" content="{{ site.baseurl }}{{ page.url }}">{% endif %}
  {% if page.directions %}<meta name="twitter:description" content="{{ page.content | strip_html }}">{% else %}<meta name="twitter:description" content="{{ site.title }}">{% endif %}
  {% if page.image %}<meta name="twitter:image:src" content="{{site.baseurl}}/images/{{ page.image }}">{% endif %}

</head>

<header class="md:hidden fixed top-0 left-0 w-full bg-sand z-20 px-6 py-3 shadow-sm">
  <a href="/" class="text-2xl font-gelica font-bold text-primary">Swett Recipes</a>
</header>

<nav class="w-full md:w-1/4 lg:w-1/5 md:h-full bg-sand fixed md:relative left-0 bottom-0 flex md:flex-col justify-between md:justify-start px-6 py-4 md:p-8 md:gap-4 z-10 shadow-3xl md:shadow-none {% if page.url contains '/recipes/' %}md:hidden{% endif %}">
      <a href="/" class="hidden md:block mb-4">
        <h1 class="text-3xl font-gelica font-bold text-primary leading-tight">Swett<br>Recipes</h1>
      </a>
      <a href="/" class="flex flex-col md:flex-row items-center gap-0 md:gap-2 {% if page.url == '/' %}text-primary{% endif %}">
        <svg class="w-12 md:w-10" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 16.25H15V7.5H12V16.25H9V7.5H6V16.25C6 18.9 8.49 21.05 11.625 21.2125V32.5H15.375V21.2125C18.51 21.05 21 18.9 21 16.25V7.5H18V16.25ZM25.5 12.5V22.5H29.25V32.5H33V7.5C28.86 7.5 25.5 10.3 25.5 12.5Z" fill="currentColor" />
        </svg>
        <span class="text-sm md:text-2xl font-medium md:font-gelica">Recipes</span>
      </a>

      <a href="/search" class="flex flex-col md:flex-row items-center gap-0 md:gap-2 {% if page.url == '/search.html' or page.url == '/search/' %}text-primary{% endif %}">
        <svg class="w-12 md:w-10" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M13 21.5C13 16.8056 16.8056 13 21.5 13C26.1944 13 30 16.8056 30 21.5C30 23.8248 29.0667 25.9315 27.5544 27.4661C27.5392 27.4801 27.5241 27.4946 27.5093 27.5093C27.4946 27.5241 27.4801 27.5392 27.4661 27.5544C25.9315 29.0667 23.8248 30 21.5 30C16.8056 30 13 26.1944 13 21.5ZM28.502 30.6233C26.5628 32.1139 24.1349 33 21.5 33C15.1487 33 10 27.8513 10 21.5C10 15.1487 15.1487 10 21.5 10C27.8513 10 33 15.1487 33 21.5C33 24.1349 32.1139 26.5628 30.6233 28.502L37.5607 35.4393C38.1464 36.0251 38.1464 36.9749 37.5607 37.5607C36.9749 38.1465 36.0251 38.1465 35.4393 37.5607L28.502 30.6233Z" fill="currentColor" />
        </svg>
        <span class="text-sm md:text-2xl font-medium md:font-gelica">Search</span>
      </a>

</nav>
